# Version Catalog
# Policy (Req 1.7 / NFR 1.1 / NFR 1.2): declare GA stable versions only.
# Do not adopt alpha / beta / RC versions as defaults.
# When stable version is unavailable, justify in a comment near the entry.

[versions]
# Build toolchain
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# DI
hilt = "2.52"
hilt-navigation-compose = "1.2.0"

# AndroidX
androidx-core-ktx = "1.15.0"
androidx-activity-compose = "1.9.3"
androidx-lifecycle = "2.8.7"
androidx-navigation-compose = "2.8.4"
# androidx-security-crypto: GA stable is 1.0.0（2021-04 リリース）。1.1.x 系統は
# 2026-06 時点でも alpha のみ（alpha06 が最新）であり、CLAUDE.md / libs.versions.toml の
# "GA stable のみ" 方針に従い 1.0.0 を採用する。Issue #20 TokenStore で使用。
androidx-security-crypto = "1.0.0"
# androidx-datastore-preferences: 1.1.1 が GA stable（2024-05 リリース）。Issue #25
# テーマモード永続化で使用。androidx.datastore:datastore-preferences は単独で artifact
# 化されており、Proto DataStore など他系統への追加依存は持たない。
androidx-datastore = "1.1.1"
# androidx-browser: 1.8.0 が GA stable（2024-04 リリース）。Issue #37 で記事元 URL を
# Chrome Custom Tabs 経由で開くために使用。1.9.x 系統は 2026-06 時点で alpha のみ。
# CustomTabsIntent / CustomTabsClient 等のコア API のみ利用し、CCT セッション warmup や
# Trusted Web Activity は使用しない（requirements.md "Out of Scope"）。
androidx-browser = "1.8.0"

# Compose
compose-bom = "2024.10.01"

# Coroutines / Serialization
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"

# Networking / Image
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinx-serialization-converter = "1.0.0"
coil = "2.7.0"

# Paging
paging = "3.3.4"

# Test
junit = "4.13.2"
turbine = "1.1.0"
# mockwebserver は okhttp と同じバージョン系列で揃える（同梱モジュール）。
# Issue #17 で APIClient テストの実 HTTP 経路検証に使用。

[libraries]
# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }

# Compose BOM-managed
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Coroutines / Serialization
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Networking (declared for downstream Issues; not yet wired in this skeleton)
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "kotlinx-serialization-converter" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Paging
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
# paging-common は JVM 単体テストから PagingSource.load() を呼び出すために使用する
# （paging-runtime は Android 依存のため JVM テストでは直接利用しない）。
# Issue #18 で CursorPagingSource 基盤を実装するために追加。
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
# paging-testing は TestPager で refresh / append / retry を結合確認するために使用する。
# Issue #18 の Req 3 / Req 4 を AC 単位で検証するために追加。
androidx-paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
